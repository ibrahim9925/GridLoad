name: ERP Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Set up test environment
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}" > .env.test
    
    - name: Run unit tests
      run: |
        cd tests
        python -m pytest -v -m "unit" --junitxml=reports/junit-unit.xml --html=reports/unit-report.html
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results
        path: tests/reports/
    
    - name: Publish unit test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Tests
        path: tests/reports/junit-unit.xml
        reporter: java-junit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Set up test environment
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}" > .env.test
    
    - name: Run integration tests
      run: |
        cd tests
        python -m pytest -v -m "integration" --junitxml=reports/junit-integration.xml --html=reports/integration-report.html
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: tests/reports/
    
    - name: Publish integration test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Integration Tests
        path: tests/reports/junit-integration.xml
        reporter: java-junit

  critical-workflows:
    name: Critical Business Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Set up test environment
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}" > .env.test
    
    - name: Run critical workflow tests
      run: |
        cd tests
        python -m pytest -v -m "critical" --junitxml=reports/junit-critical.xml --html=reports/critical-report.html
    
    - name: Upload critical test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: critical-test-results
        path: tests/reports/
    
    - name: Publish critical test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Critical Workflow Tests
        path: tests/reports/junit-critical.xml
        reporter: java-junit

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: critical-workflows
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf-test]')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Set up test environment
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}" > .env.test
    
    - name: Run performance tests
      run: |
        cd tests
        python -m pytest -v -m "performance" --junitxml=reports/junit-performance.xml --html=reports/performance-report.html
    
    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: tests/reports/

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: critical-workflows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Install Playwright
      run: |
        cd tests
        python -m playwright install chromium
    
    - name: Install Node.js dependencies
      run: npm install
    
    - name: Build application
      run: npm run build
    
    - name: Start application
      run: |
        npm run preview &
        sleep 10
    
    - name: Run E2E tests
      run: |
        cd tests
        python -m pytest -v -m "e2e" --junitxml=reports/junit-e2e.xml --html=reports/e2e-report.html
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: tests/reports/
    
    - name: Upload E2E screenshots
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: e2e-screenshots
        path: tests/e2e/screenshots/

  regression-tests:
    name: Regression Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-tests, integration-tests, critical-workflows]
    if: github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Set up test environment
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}" > .env.test
    
    - name: Run regression tests
      run: |
        cd tests
        python -m pytest -v -m "regression" --junitxml=reports/junit-regression.xml --html=reports/regression-report.html
    
    - name: Upload regression test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: regression-test-results
        path: tests/reports/

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, critical-workflows, performance-tests, e2e-tests, regression-tests]
    if: always()
    
    steps:
    - name: Notify Slack on Success
      if: ${{ !contains(needs.*.result, 'failure') }}
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "✅ All ERP tests passed successfully!"
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
    
    - name: Notify Slack on Failure
      if: ${{ contains(needs.*.result, 'failure') }}
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "❌ ERP test suite failed. Check the GitHub Actions for details."
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Cleanup job to manage test data
  cleanup:
    name: Cleanup Test Data
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, critical-workflows, performance-tests, e2e-tests, regression-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    
    - name: Cleanup test data
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}" > .env.test
        cd tests
        python -c "
        from utils.database_manager import DatabaseManager
        from utils.test_config import TestConfig
        
        config = TestConfig()
        db = DatabaseManager(config)
        db.connect()
        
        # Clean up any remaining test snapshots
        print('Cleaning up test snapshots...')
        db.snapshots.clear()
        
        print('Test cleanup completed')
        "